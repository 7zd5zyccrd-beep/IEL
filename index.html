                      "Sperren". Noch offen: Lernen (Stufe 3),

                      anlegen, Einkauf abschließen. Daten nur im Gerät.

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Einkaufszettel</title>
<style>
:root{
  --papier:#F1F2EE;
  --karte:#FFFFFF;
  --tinte:#17201A;
  --matt:#6E7772;
  --linie:#DEE2DA;
  --akzent:#2E6F4E;
  --akzent-hell:#E2EFE7;
  --rand:14px;
  --sicher-oben:env(safe-area-inset-top);
  --sicher-unten:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papier);color:var(--tinte);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--sicher-unten));
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- Schloss ---------- */
.schloss{
  position:fixed;inset:0;z-index:80;background:var(--papier);
  display:flex;flex-direction:column;justify-content:center;
  padding:24px 22px calc(24px + var(--sicher-unten));
}
.schloss h1{margin:0 0 6px;font-size:30px;letter-spacing:-.6px;font-weight:650}
.schloss p{margin:0 0 24px;color:var(--matt);font-size:15px;max-width:34em}
.schloss input{
  width:100%;min-height:52px;padding:0 14px;margin-bottom:12px;
  border:1px solid var(--linie);border-radius:var(--rand);background:var(--karte);
}
.schloss .fehler{color:#9A3D2B;font-size:15px;margin:0 0 12px;min-height:20px}
.schlossfuss{margin-top:20px;font-size:12px;color:var(--matt)}

/* ---------- Kopf ---------- */
.kopf{
  position:sticky;top:0;z-index:20;background:var(--papier);
  padding:calc(10px + var(--sicher-oben)) 16px 0;
}
.kopfzeile{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.kopfzeile h1{margin:0;font-size:26px;letter-spacing:-.5px;font-weight:650}
.kopfrechts{display:flex;align-items:center;gap:10px;flex:none}
.fassung{font-size:13px;color:var(--matt);white-space:nowrap}
.funk{width:9px;height:9px;border-radius:50%;background:var(--akzent);flex:none}
.funk[data-aus="1"]{background:#C8862F}
.reiter{display:flex;gap:6px;margin:12px 0 0;padding:4px;background:#E4E7E0;border-radius:var(--rand)}
.reiter button{
  flex:1;min-height:40px;border-radius:10px;font-size:15px;font-weight:550;color:var(--matt);
}
.reiter button[aria-selected="true"]{background:var(--karte);color:var(--tinte);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.zaehler{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;
  background:var(--akzent);color:#fff;font-size:12px;line-height:19px;font-weight:600;vertical-align:1px}
.reiter button[aria-selected="false"] .zaehler{background:#C3C9BF;color:#fff}
.streifen{
  margin:10px 0 0;padding:9px 12px;border-radius:12px;
  background:#F6E9D2;color:#6B4A15;font-size:14px;
}

.blatt{padding:0 16px}
.suchzeile{position:sticky;top:calc(var(--sicher-oben) + 108px);z-index:15;background:var(--papier);padding:12px 0 8px}
.suchfeld{
  width:100%;min-height:46px;padding:0 40px 0 14px;border:1px solid var(--linie);
  border-radius:var(--rand);background:var(--karte);
}
.suchfeld::placeholder{color:var(--matt)}
.suchhuelle{position:relative}
.loeschen{position:absolute;right:4px;top:0;bottom:0;width:38px;color:var(--matt);font-size:20px}

/* ---------- Kacheln ---------- */
.kacheln{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
.kachel{
  display:flex;align-items:center;gap:7px;
  min-height:44px;padding:0 13px;border-radius:var(--rand);
  background:var(--karte);border:1px solid var(--linie);
  font-size:15px;font-weight:500;
}
.kachel .punkt{width:8px;height:8px;border-radius:50%;flex:none}
.kachel[data-drauf="1"]{background:var(--akzent-hell);border-color:#B6D5C3;color:#1D4F38}
.kachel .menge{font-size:13px;font-weight:600;color:var(--akzent);white-space:nowrap}
.kachel.neu{background:var(--karte);border-style:dashed;color:var(--akzent);border-color:#A9C7B6}
.mehr{width:100%;min-height:44px;margin-top:4px;color:var(--akzent);font-size:15px;font-weight:550}
.leer{padding:28px 4px;color:var(--matt);font-size:15px}

/* ---------- Zettel ---------- */
.gruppe{margin:18px 0 0}
.gruppe h2{
  display:flex;align-items:center;gap:8px;margin:0 0 8px;
  font-size:13px;font-weight:650;color:var(--matt);letter-spacing:.2px;
}
.gruppe h2 .punkt{width:9px;height:9px;border-radius:50%}
.posten{background:var(--karte);border:1px solid var(--linie);border-radius:var(--rand);overflow:hidden}
.zeile{display:flex;align-items:stretch;border-top:1px solid var(--linie)}
.zeile:first-child{border-top:0}
.haken{
  flex:1;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 4px 8px 14px;text-align:left;
}
.kasten{
  width:22px;height:22px;flex:none;border:1.5px solid #B9C0B7;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
}
.zeile[data-ab="1"] .kasten{background:var(--akzent);border-color:var(--akzent)}
.zeile[data-ab="1"] .kasten::after{content:"";width:11px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}
.zeile[data-ab="1"] .name{text-decoration:line-through;color:var(--matt)}
.name{font-size:17px}
.mengenknopf{
  min-width:78px;padding:0 14px;text-align:right;font-size:15px;font-weight:600;color:var(--akzent);
}
.zeile[data-ab="1"] .mengenknopf{color:#AAB2A9}

.fussleiste{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 16px calc(10px + var(--sicher-unten));
  background:rgba(241,242,238,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linie);
}
.hauptknopf{
  width:100%;min-height:52px;border-radius:var(--rand);background:var(--akzent);color:#fff;
  font-size:17px;font-weight:600;
}
.hauptknopf[disabled]{background:#C6CCC5;color:#F4F6F2}

/* ---------- Blatt von unten ---------- */
.schleier{position:fixed;inset:0;z-index:40;background:rgba(15,22,18,.34);opacity:0;pointer-events:none;transition:opacity .18s}
.schleier[data-auf="1"]{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(100%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);
  background:var(--papier);border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + var(--sicher-unten));
}
.sheet[data-auf="1"]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.schleier{transition:none}}
.sheet h3{margin:0 0 2px;font-size:20px;font-weight:650}
.sheet .unterzeile{margin:0 0 16px;font-size:14px;color:var(--matt)}
.mengenreihe{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.rundknopf{
  width:52px;height:52px;flex:none;border-radius:50%;background:var(--karte);border:1px solid var(--linie);
  display:flex;align-items:center;justify-content:center;
}
.rundknopf i{display:block;background:var(--tinte);border-radius:2px}
.rundknopf .waag{width:17px;height:2.5px}
.rundknopf .senk{width:2.5px;height:17px;margin-left:-9.75px}
.mengenfeld{
  flex:1;min-width:0;height:52px;text-align:center;font-size:22px;font-weight:600;
  border:1px solid var(--linie);border-radius:var(--rand);background:var(--karte);
}
.wahl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.wahl button{
  min-height:42px;padding:0 14px;border-radius:12px;background:var(--karte);
  border:1px solid var(--linie);font-size:15px;
}
.wahl button[aria-pressed="true"]{background:var(--akzent);border-color:var(--akzent);color:#fff;font-weight:600}
.sheet label{display:block;margin:0 0 7px;font-size:13px;font-weight:650;color:var(--matt)}
.namensfeld{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--linie);border-radius:var(--rand);background:var(--karte);margin-bottom:16px}
.sheetknoepfe{display:flex;gap:10px}
.sheetknoepfe button{flex:1;min-height:52px;border-radius:var(--rand);font-size:17px;font-weight:600}
.weg{background:var(--karte);border:1px solid var(--linie);color:#9A3D2B}
.ok{background:var(--akzent);color:#fff}
.hinweis{
  position:fixed;left:16px;right:16px;bottom:calc(84px + var(--sicher-unten));z-index:50;
  padding:12px 16px;border-radius:var(--rand);background:var(--tinte);color:#F2F4F0;
  font-size:15px;text-align:center;opacity:0;transform:translateY(6px);
  transition:opacity .16s,transform .16s;pointer-events:none;
}
.hinweis[data-auf="1"]{opacity:1;transform:none}

@media (min-width:700px){
  .kopf,.blatt,.fussleiste{max-width:680px;margin-left:auto;margin-right:auto}
  .sheet{max-width:680px;margin:0 auto;border-radius:20px 20px 0 0}
  .schloss{max-width:520px;margin:0 auto}
}
</style>
</head>

<!-- Schlossbildschirm -->
<div class="schloss" id="schloss">
  <h1>Einkaufszettel</h1>
  <p>Haushaltspasswort eingeben. Das Gerät bleibt danach angemeldet, bis du es sperrst.</p>
  <input id="passwort" type="password" inputmode="text" autocomplete="current-password"
         placeholder="Passwort" aria-label="Haushaltspasswort">
  <p class="fehler" id="schlossFehler"></p>
  <button class="hauptknopf" id="anmelden">Anmelden</button>
  <p class="schlossfuss">v0.2 · 04.09.2026</p>
</div>

<div id="app" hidden>
  <header class="kopf">
    <div class="kopfzeile">
      <h1>Einkaufszettel</h1>
      <span class="kopfrechts">
        <span class="funk" id="funk" title="Verbindung"></span>
        <button class="fassung" id="sperren">Sperren</button>
      </span>
    </div>
    <div class="reiter" role="tablist">
      <button id="rVor" role="tab" aria-selected="true">Vorschläge</button>
      <button id="rZet" role="tab" aria-selected="false">Zettel<span class="zaehler" id="zettelZahl">0</span></button>
    </div>
    <div class="streifen" id="streifen" hidden></div>
  </header>

  <main class="blatt">
    <section id="ansichtVor">
      <div class="suchzeile">
        <div class="suchhuelle">
          <input id="suche" class="suchfeld" type="search" inputmode="search" autocomplete="off"
                 placeholder="Suchen oder neu anlegen" aria-label="Artikel suchen">
          <button class="loeschen" id="sucheLeeren" hidden aria-label="Suche leeren">✕</button>
        </div>
      </div>
      <div class="kacheln" id="kacheln"></div>
    </section>
    <section id="ansichtZet" hidden></section>
  </main>

  <div class="fussleiste" id="fussleiste" hidden>
    <button class="hauptknopf" id="abschliessen" disabled>Einkauf abschließen</button>
  </div>
</div>

<div class="schleier" id="schleier"></div>

<div class="sheet" id="sheetMenge" role="dialog" aria-modal="true" aria-labelledby="mengeTitel">
  <h3 id="mengeTitel">Artikel</h3>
  <p class="unterzeile" id="mengeUnter"></p>
  <div class="mengenreihe">
    <button class="rundknopf" id="mengeMinus" aria-label="Weniger"><i class="waag"></i></button>
    <input class="mengenfeld" id="mengeFeld" inputmode="decimal" aria-label="Menge">
    <button class="rundknopf" id="mengePlus" aria-label="Mehr"><i class="waag"></i><i class="senk"></i></button>
  </div>
  <label for="mengeEinheiten">Einheit</label>
  <div class="wahl" id="mengeEinheiten"></div>
  <div class="sheetknoepfe">
    <button class="weg" id="mengeWeg">Vom Zettel</button>
    <button class="ok" id="mengeOk">Übernehmen</button>
  </div>
</div>

<div class="sheet" id="sheetNeu" role="dialog" aria-modal="true" aria-labelledby="neuTitel">
  <h3 id="neuTitel">Neuer Artikel</h3>
  <p class="unterzeile">Gruppe und Einheit merkt sich die App für das nächste Mal.</p>
  <label for="neuName">Name</label>
  <input class="namensfeld" id="neuName" autocomplete="off">
  <label>Gruppe</label>
  <div class="wahl" id="neuGruppen"></div>
  <label>Einheit</label>
  <div class="wahl" id="neuEinheiten"></div>
  <div class="sheetknoepfe">
    <button class="weg" id="neuAbbruch">Abbrechen</button>
    <button class="ok" id="neuOk">Anlegen</button>
  </div>
</div>

<div class="sheet" id="sheetFrage" role="dialog" aria-modal="true" aria-labelledby="frageTitel">
  <h3 id="frageTitel">Einkauf abschließen?</h3>
  <p class="unterzeile" id="frageUnter"></p>
  <div class="sheetknoepfe">
    <button class="weg" id="frageNein">Zurück</button>
    <button class="ok" id="frageJa">Abschließen</button>
  </div>
</div>

<div class="hinweis" id="hinweis" role="status"></div>

hd:[["Spülmittel","Flasche",2],["Spülmaschinentabs","Pkg",2],["Klarspüler","Flasche",1],["Waschmittel","Pkg",2],
    ["Weichspüler","Flasche",1],["Allzweckreiniger","Flasche",1],["WC-Reiniger","Flasche",1],

};

/* ============ Zustand ============ */
const SP_SPIEGEL = "einkauf.spiegel";
const SP_ANGEMELDET = "einkauf.angemeldet";

let UEBER = {};        // Änderungen und eigene Artikel aus der Datenbank
let ZETTEL = {};       // der Zettel aus der Datenbank
let ARTIKEL = {};      // Grundstock + Überlagerung, daraus wird gezeichnet
let nurLesen = false;  // ohne Verbindung beim Start
let F = null;          // Firebase-Werkzeuge

function kennung(name){
  return name.toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function standardMenge(e){ return (e==="g"||e==="ml") ? 500 : 1; }

function grundstock(){
  const a = {};
  GRUPPEN.forEach(g=>{
    (KATALOG[g.id]||[]).forEach(([name,einheit,gewicht])=>{
      a[kennung(name)] = {n:name, g:g.id, e:einheit, w:gewicht, m:standardMenge(einheit),
                          kaeufe:0, zuletzt:0, letzte:[], eigen:false};
    });
  });
  return a;
}
function artikelMischen(){
  ARTIKEL = grundstock();
  Object.keys(UEBER).forEach(id=>{
    const q = UEBER[id] || {};
    if(ARTIKEL[id]){
      ["e","m","kaeufe","zuletzt","letzte"].forEach(k=>{ if(q[k]!==undefined) ARTIKEL[id][k]=q[k]; });
    }else if(q.n && q.g){
      ARTIKEL[id] = {n:q.n, g:q.g, e:q.e||"Stk", w:q.w||2, m:q.m||standardMenge(q.e||"Stk"),
                     kaeufe:q.kaeufe||0, zuletzt:q.zuletzt||0, letzte:q.letzte||[], eigen:true};
    }
    if(ARTIKEL[id] && !Array.isArray(ARTIKEL[id].letzte)) ARTIKEL[id].letzte = [];
  });
}

/* ---- Kopie im Gerät, für schlechten Empfang ---- */
function spiegelSchreiben(){
  try{ localStorage.setItem(SP_SPIEGEL, JSON.stringify({u:UEBER, z:ZETTEL})); }catch(f){}
}
function spiegelLesen(){
  try{
    const roh = localStorage.getItem(SP_SPIEGEL);
    if(!roh) return false;
    const d = JSON.parse(roh);
    UEBER = d.u||{}; ZETTEL = d.z||{};
    return true;
  }catch(f){ return false; }
}
function merker(wert){
  try{ wert ? localStorage.setItem(SP_ANGEMELDET,"1") : localStorage.removeItem(SP_ANGEMELDET); }catch(f){}
}
function merkerGesetzt(){
  try{ return localStorage.getItem(SP_ANGEMELDET)==="1"; }catch(f){ return false; }
}

/* ============ Hilfen ============ */
const $ = id => document.getElementById(id);
const gruppeVon = id => GRUPPEN.find(g=>g.id===id) || GRUPPEN[GRUPPEN.length-1];
const zettelListe = () => Object.keys(ZETTEL).filter(id=>ARTIKEL[id]);
const offeneZahl = () => zettelListe().filter(id=>!ZETTEL[id].ab).length;
const abgehakte = () => zettelListe().filter(id=>ZETTEL[id].ab);

function mengeText(menge, einheit){
  const m = Math.round(menge*100)/100;
  const t = (Math.abs(m-Math.round(m))<0.001) ? String(Math.round(m)) : String(m).replace(".",",");
  return einheit==="Stk" ? t+"×" : t+" "+einheit;
}
let hinweisUhr = null;
function melden(text){
  const h = $("hinweis");
  h.textContent = text; h.dataset.auf = "1";
  clearTimeout(hinweisUhr);
  hinweisUhr = setTimeout(()=>{ h.dataset.auf = "0"; }, 1600);
}
function streifen(text){
  const s = $("streifen");
  if(text){ s.textContent = text; s.hidden = false; } else s.hidden = true;
}

/* ============ Schreiben in die Datenbank ============ */
function schreibsperre(){
  if(nurLesen || !F){ melden("Ohne Verbindung nicht änderbar."); return true; }
  return false;
}
function pfad(p){ return F.ref(F.db, p); }
async function setzen(p, wert){ try{ await F.set(pfad(p), wert); }catch(f){ melden("Konnte nicht gespeichert werden."); } }
async function aendern(p, teil){ try{ await F.update(pfad(p), teil); }catch(f){ melden("Konnte nicht gespeichert werden."); } }
async function entfernen(p){ try{ await F.remove(pfad(p)); }catch(f){ melden("Konnte nicht gespeichert werden."); } }

/* ============ Punktzahl (feste Grundgewichte; das Lernen folgt in Stufe 3) ============ */
function punkte(id){
  const a = ARTIKEL[id];
  let p = a.w*10 + Math.min(a.kaeufe||0,12)*4;
  if(a.zuletzt){
    const tage = (Date.now()-a.zuletzt)/86400000;
    p += Math.max(0, 14-tage);
  }
  if(a.eigen) p += 6;
  return p;
}

/* ============ Ansichten ============ */
let ansicht = "vor";
let alleZeigen = false;
const OBERE = 36;

function reiterSetzen(neu){
  ansicht = neu;
  $("rVor").setAttribute("aria-selected", neu==="vor");
  $("rZet").setAttribute("aria-selected", neu==="zet");
  $("ansichtVor").hidden = neu!=="vor";
  $("ansichtZet").hidden = neu!=="zet";
  $("fussleiste").hidden = neu!=="zet";
  window.scrollTo(0,0);
  zeichnen();
}

function zeichnen(){
  artikelMischen();
  $("zettelZahl").textContent = offeneZahl();
  if(ansicht==="vor") kachelnZeichnen(); else zettelZeichnen();
  const fertig = abgehakte().length;
  const k = $("abschliessen");
  k.disabled = fertig===0 || nurLesen;
  k.textContent = fertig ? "Einkauf abschließen ("+fertig+")" : "Einkauf abschließen";
}

function kachelnZeichnen(){
  const feld = $("suche").value.trim();
  const such = feld.toLowerCase();
  $("sucheLeeren").hidden = !feld;

  let ids = Object.keys(ARTIKEL);
  if(such) ids = ids.filter(id=>ARTIKEL[id].n.toLowerCase().includes(such));
  ids.sort((a,b)=>punkte(b)-punkte(a) || ARTIKEL[a].n.localeCompare(ARTIKEL[b].n,"de"));

  const gekuerzt = (!such && !alleZeigen && ids.length>OBERE);
  const sichtbar = gekuerzt ? ids.slice(0,OBERE) : ids;

  const kasten = $("kacheln");
  kasten.innerHTML = "";

  const treffer = feld && ids.some(id=>ARTIKEL[id].n.toLowerCase()===such);
  if(feld && !treffer){
    const b = document.createElement("button");
    b.className = "kachel neu";
    b.textContent = "„"+feld+"“ anlegen";
    b.onclick = ()=>{ if(!schreibsperre()) neuOeffnen(feld); };
    kasten.appendChild(b);
  }

  sichtbar.forEach(id=>{
    const a = ARTIKEL[id], p = ZETTEL[id];
    const b = document.createElement("button");
    b.className = "kachel";
    if(p) b.dataset.drauf = "1";
    const punkt = document.createElement("span");
    punkt.className = "punkt"; punkt.style.background = gruppeVon(a.g).farbe;
    const name = document.createElement("span"); name.textContent = a.n;
    b.appendChild(punkt); b.appendChild(name);
    if(p){
      const m = document.createElement("span");
      m.className = "menge"; m.textContent = mengeText(p.menge,p.einheit);
      b.appendChild(m);
    }
    b.onclick = ()=> p ? mengeOeffnen(id) : aufDenZettel(id);
    kasten.appendChild(b);
  });

  if(!sichtbar.length){
    const l = document.createElement("div");
    l.className = "leer";
    l.textContent = feld ? "Kein Artikel gefunden." : "Noch keine Artikel.";
    kasten.appendChild(l);
  }
  if(gekuerzt){
    const b = document.createElement("button");
    b.className = "mehr";
    b.textContent = "Alle "+ids.length+" Artikel zeigen";
    b.onclick = ()=>{ alleZeigen = true; kachelnZeichnen(); };
    kasten.appendChild(b);
  }
}

function zettelZeichnen(){
  const ziel = $("ansichtZet");
  ziel.innerHTML = "";
  const ids = zettelListe();
  if(!ids.length){
    const l = document.createElement("div");
    l.className = "leer";
    l.textContent = "Der Zettel ist leer. Unter „Vorschläge“ tippst du an, was mit soll.";
    ziel.appendChild(l);
    return;
  }
  GRUPPEN.forEach(g=>{
    const posten = ids.filter(id=>ARTIKEL[id].g===g.id)
                      .sort((a,b)=>ARTIKEL[a].n.localeCompare(ARTIKEL[b].n,"de"));
    if(!posten.length) return;

    const kasten = document.createElement("section");
    kasten.className = "gruppe";
    const h = document.createElement("h2");
    const punkt = document.createElement("span");
    punkt.className = "punkt"; punkt.style.background = g.farbe;
    h.appendChild(punkt); h.appendChild(document.createTextNode(g.name));
    kasten.appendChild(h);

    const liste = document.createElement("div");
    liste.className = "posten";
    posten.forEach(id=>{
      const a = ARTIKEL[id], p = ZETTEL[id];
      const zeile = document.createElement("div");
      zeile.className = "zeile";
      zeile.dataset.ab = p.ab ? "1" : "0";

      const haken = document.createElement("button");
      haken.className = "haken";
      const kast = document.createElement("span"); kast.className = "kasten";
      const name = document.createElement("span"); name.className = "name"; name.textContent = a.n;
      haken.appendChild(kast); haken.appendChild(name);
      haken.setAttribute("aria-pressed", !!p.ab);
      haken.onclick = ()=>{ if(!schreibsperre()) aendern("zettel/"+id, {ab: !p.ab}); };

      const menge = document.createElement("button");
      menge.className = "mengenknopf";
      menge.textContent = mengeText(p.menge,p.einheit);
      menge.setAttribute("aria-label","Menge ändern");
      menge.onclick = ()=>mengeOeffnen(id);

      zeile.appendChild(haken); zeile.appendChild(menge);
      liste.appendChild(zeile);
    });
    kasten.appendChild(liste);
    ziel.appendChild(kasten);
  });
}

/* ============ Zettel füllen ============ */
function aufDenZettel(id){
  if(schreibsperre()) return;
  const a = ARTIKEL[id];
  setzen("zettel/"+id, {menge:a.m, einheit:a.e, ab:false, t:Date.now()});
  melden(a.n+", "+mengeText(a.m,a.e)+" notiert");
}

/* ============ Blätter ============ */
let offenesBlatt = null, mengeId = null, mengeEinheit = null, neuGruppe = null, neuEinheit = null;

function blattOeffnen(el){ offenesBlatt = el; $("schleier").dataset.auf = "1"; el.dataset.auf = "1"; }
function blattSchliessen(){
  if(offenesBlatt) offenesBlatt.dataset.auf = "0";
  $("schleier").dataset.auf = "0";
  offenesBlatt = null;
}
$("schleier").onclick = blattSchliessen;

function mengeOeffnen(id){
  if(schreibsperre()) return;
  mengeId = id;
  const a = ARTIKEL[id], p = ZETTEL[id];
  mengeEinheit = p ? p.einheit : a.e;
  $("mengeTitel").textContent = a.n;
  $("mengeUnter").textContent = gruppeVon(a.g).name + (p ? "" : " · noch nicht auf dem Zettel");
  $("mengeFeld").value = String(p ? p.menge : a.m).replace(".",",");
  $("mengeWeg").hidden = !p;
  einheitenZeichnen($("mengeEinheiten"), mengeEinheit, e=>{ mengeEinheit = e; });
  blattOeffnen($("sheetMenge"));
}
function einheitenZeichnen(kasten, gewaehlt, beiWahl){
  kasten.innerHTML = "";
  EINHEITEN.forEach(e=>{
    const b = document.createElement("button");
    b.textContent = e;
    b.setAttribute("aria-pressed", e===gewaehlt);
    b.onclick = ()=>{
      beiWahl(e);
      [...kasten.children].forEach(c=>c.setAttribute("aria-pressed", c===b));
    };
    kasten.appendChild(b);
  });
}
function mengeLesen(){
  const w = parseFloat((($("mengeFeld").value)||"").replace(",","."));
  return (isFinite(w) && w>0) ? w : 1;
}
function mengeSchreiben(w){ $("mengeFeld").value = String(Math.round(w*100)/100).replace(".",","); }
function schritt(){ return (mengeEinheit==="g"||mengeEinheit==="ml") ? 100 : (mengeEinheit==="kg" ? 0.5 : 1); }
$("mengePlus").onclick = ()=>mengeSchreiben(mengeLesen()+schritt());
$("mengeMinus").onclick = ()=>mengeSchreiben(Math.max(schritt(), mengeLesen()-schritt()));
$("mengeOk").onclick = ()=>{
  const w = mengeLesen(), p = ZETTEL[mengeId];
  aendern("artikel/"+mengeId, {m:w, e:mengeEinheit});     // Vorschlag fürs nächste Mal
  if(p) aendern("zettel/"+mengeId, {menge:w, einheit:mengeEinheit});
  else  setzen("zettel/"+mengeId, {menge:w, einheit:mengeEinheit, ab:false, t:Date.now()});
  blattSchliessen();
};
$("mengeWeg").onclick = ()=>{
  const name = ARTIKEL[mengeId].n;
  entfernen("zettel/"+mengeId);
  blattSchliessen();
  melden(name+" vom Zettel");
};

function neuOeffnen(name){
  neuGruppe = null; neuEinheit = "Stk";
  $("neuName").value = name;
  const kasten = $("neuGruppen");
  kasten.innerHTML = "";
  GRUPPEN.forEach(g=>{
    const b = document.createElement("button");
    const punkt = document.createElement("span");
    punkt.style.cssText = "display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:"+g.farbe;
    b.appendChild(punkt); b.appendChild(document.createTextNode(g.name));
    b.setAttribute("aria-pressed","false");
    b.onclick = ()=>{
      neuGruppe = g.id;
      [...kasten.children].forEach(c=>c.setAttribute("aria-pressed", c===b));
    };
    kasten.appendChild(b);
  });
  einheitenZeichnen($("neuEinheiten"), neuEinheit, e=>{ neuEinheit = e; });
  blattOeffnen($("sheetNeu"));
}
$("neuAbbruch").onclick = blattSchliessen;
$("neuOk").onclick = ()=>{
  const name = $("neuName").value.trim();
  if(!name){ melden("Der Name fehlt noch."); return; }
  if(!neuGruppe){ melden("Bitte eine Gruppe wählen."); return; }
  const id = kennung(name);
  const schon = !!ARTIKEL[id];
  if(!schon){
    setzen("artikel/"+id, {n:name, g:neuGruppe, e:neuEinheit, w:2, m:standardMenge(neuEinheit),
                           kaeufe:0, zuletzt:0, eigen:true});
  }
  const menge = schon ? ARTIKEL[id].m : standardMenge(neuEinheit);
  const einheit = schon ? ARTIKEL[id].e : neuEinheit;
  if(!ZETTEL[id]) setzen("zettel/"+id, {menge:menge, einheit:einheit, ab:false, t:Date.now()});
  $("suche").value = ""; alleZeigen = false;
  blattSchliessen();
  melden(schon ? name+" gab es schon – notiert" : name+" angelegt und notiert");
};

/* --- Einkauf abschließen --- */
$("abschliessen").onclick = ()=>{
  if(schreibsperre()) return;
  const fertig = abgehakte().length;
  const offen = zettelListe().length - fertig;
  $("frageUnter").textContent = fertig+" abgehakt"+(offen ? ", "+offen+" bleiben stehen." : ".")+
                                " Abgehaktes wird als Kauf vermerkt.";
  blattOeffnen($("sheetFrage"));
};
$("frageNein").onclick = blattSchliessen;
$("frageJa").onclick = async ()=>{
  const jetzt = Date.now();
  const fertig = abgehakte();
  const stapel = {};
  fertig.forEach(id=>{
    const a = ARTIKEL[id];
    const letzte = (a.letzte||[]).concat(jetzt).slice(-12);   // Grundlage fürs Lernen in Stufe 3
    stapel["artikel/"+id+"/kaeufe"]  = (a.kaeufe||0)+1;
    stapel["artikel/"+id+"/zuletzt"] = jetzt;
    stapel["artikel/"+id+"/letzte"]  = letzte;
    stapel["zettel/"+id] = null;
  });
  blattSchliessen();
  try{ await F.update(F.ref(F.db), stapel); melden(fertig.length+" Artikel eingekauft"); }
  catch(f){ melden("Konnte nicht gespeichert werden."); }
};

/* ============ Bedienung ============ */
$("rVor").onclick = ()=>reiterSetzen("vor");
$("rZet").onclick = ()=>reiterSetzen("zet");
$("suche").addEventListener("input", ()=>{ alleZeigen = false; kachelnZeichnen(); });
$("suche").addEventListener("keydown", e=>{ if(e.key==="Enter") e.target.blur(); });
$("sucheLeeren").onclick = ()=>{ $("suche").value=""; alleZeigen=false; kachelnZeichnen(); $("suche").focus(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && offenesBlatt) blattSchliessen(); });

/* ============ Anmeldung und Abgleich ============ */
function fehlerText(code){
  if(code==="auth/invalid-credential" || code==="auth/wrong-password" || code==="auth/invalid-login-credentials")
    return "Passwort stimmt nicht.";
  if(code==="auth/too-many-requests") return "Zu viele Versuche. Kurz warten, dann noch einmal.";
  if(code==="auth/network-request-failed") return "Keine Verbindung zum Netz.";
  if(code==="auth/user-disabled") return "Dieses Konto ist gesperrt.";
  return "Anmeldung nicht möglich ("+code+").";
}
function appZeigen(){
  $("schloss").hidden = true;
  $("app").hidden = false;
  reiterSetzen("vor");
}
function schlossZeigen(){
  $("app").hidden = true;
  $("schloss").hidden = false;
  $("passwort").value = "";
}

let lauscht = false;
function lauschen(dbMod, db){
  if(lauscht) return;
  lauscht = true;

  dbMod.onValue(dbMod.ref(db,"artikel"), s=>{
    UEBER = s.val() || {};
    spiegelSchreiben(); zeichnen();
  }, f=>{ streifen("Die Datenbank antwortet nicht: "+(f.message||"")); });

  dbMod.onValue(dbMod.ref(db,"zettel"), s=>{
    ZETTEL = s.val() || {};
    spiegelSchreiben(); zeichnen();
  });

  dbMod.onValue(dbMod.ref(db,".info/connected"), s=>{
    const da = s.val()===true;
    $("funk").dataset.aus = da ? "0" : "1";
    streifen(da ? "" : "Keine Verbindung – Änderungen werden nachgeholt, sobald das Netz wieder da ist.");
  });
}

async function start(){
  let mod;
  try{
    mod = await Promise.all([
      import(SDK+"firebase-app.js"),
      import(SDK+"firebase-auth.js"),
      import(SDK+"firebase-database.js")
    ]);
  }catch(f){
    nurLesen = true;
    if(merkerGesetzt() && spiegelLesen()){
      appZeigen();
      streifen("Ohne Verbindung. Du siehst den zuletzt bekannten Stand, Änderungen sind gerade nicht möglich.");
      $("funk").dataset.aus = "1";
    }else{
      $("schlossFehler").textContent = "Keine Verbindung. Beim ersten Start auf einem Gerät ist Netz nötig.";
    }
    return;
  }

  const [appMod, authMod, dbMod] = mod;
  const app = appMod.initializeApp(FB);
  const auth = authMod.getAuth(app);
  const db = dbMod.getDatabase(app);
  F = {db, ref:dbMod.ref, set:dbMod.set, update:dbMod.update, remove:dbMod.remove};

  try{ await authMod.setPersistence(auth, authMod.browserLocalPersistence); }catch(f){}

  $("anmelden").onclick = async ()=>{
    const pw = $("passwort").value;
    if(!pw){ $("schlossFehler").textContent = "Bitte das Passwort eingeben."; return; }
    $("anmelden").disabled = true;
    $("schlossFehler").textContent = "";
    try{ await authMod.signInWithEmailAndPassword(auth, KONTO, pw); }
    catch(f){ $("schlossFehler").textContent = fehlerText(f.code||""); }
    $("anmelden").disabled = false;
  };
  $("passwort").addEventListener("keydown", e=>{ if(e.key==="Enter") $("anmelden").click(); });

  $("sperren").onclick = async ()=>{
    merker(false);
    try{ localStorage.removeItem(SP_SPIEGEL); }catch(f){}
    UEBER = {}; ZETTEL = {};
    try{ await authMod.signOut(auth); }catch(f){}
    location.reload();
  };

  authMod.onAuthStateChanged(auth, nutzer=>{
    if(nutzer){
      merker(true);
      spiegelLesen();      // erst der letzte bekannte Stand, gleich darauf die echten Daten
      appZeigen();
      lauschen(dbMod, db);
    }else{
      schlossZeigen();
    }
  });
}

start();
</script>
